<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Little Things Village — 3D Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#c9e5ed;color:#453b43}canvas{display:block;touch-action:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none} .panel{background:#fffdf5eb;border:2px solid #fff;box-shadow:0 4px 20px #68585c30;border-radius:17px;padding:10px 13px;pointer-events:auto}#brand{font-size:15px;font-weight:900}#where{font-size:12px;margin-top:3px}#coins{font-size:13px;font-weight:800;white-space:nowrap}#hint{position:absolute;top:88px;left:50%;transform:translateX(-50%);background:#fff9eae8;border-radius:20px;padding:9px 14px;text-align:center;font-size:12px;max-width:88vw;box-shadow:0 4px 12px #0001;pointer-events:none}#controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}#pad{width:142px;height:142px;border-radius:50%;background:#fff9f0b8;border:3px solid #ffffffb0;position:relative;pointer-events:auto;touch-action:none;box-shadow:0 4px 20px #0002}#stick{position:absolute;width:58px;height:58px;left:39px;top:39px;border-radius:50%;background:#df9cae;border:3px solid white;box-shadow:0 2px 8px #0002;pointer-events:none}button{border:0;background:#d99bad;color:#392b35;border-radius:18px;padding:13px 15px;font-size:14px;font-weight:850;box-shadow:0 4px 12px #0002;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}#actions{display:flex;flex-direction:column;gap:9px;align-items:end;pointer-events:auto}#action{background:#f6d379;min-width:110px}#modal{position:absolute;inset:0;background:#332d38aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}#modal.show{display:flex}#sheet{background:#fffaf3;border:3px solid white;border-radius:24px;width:min(480px,100%);max-height:82vh;overflow:auto;padding:20px;box-shadow:0 15px 50px #0005}#sheet h2{margin:0 0 8px;font-size:22px}#sheet p{line-height:1.4;font-size:14px}#choices{display:grid;gap:9px;margin-top:14px}#choices button{text-align:left;background:#e9e5d9}#choices button.correct{background:#a8ddbb}#choices button.wrong{background:#f6b3b2}#close{float:right;background:#e9dfda;padding:8px 12px}#toast{position:absolute;left:50%;top:160px;transform:translateX(-50%);background:#fffaf1;border-radius:14px;padding:10px 16px;font-size:13px;font-weight:700;display:none;z-index:4;max-width:88vw;text-align:center}#error{position:absolute;inset:0;background:#fff9f2;display:none;padding:30px;z-index:10}#footer{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);color:#4c4142;font-size:10px;opacity:.7;pointer-events:none}@media(max-width:400px){#pad{width:122px;height:122px}#stick{left:32px;top:32px;width:52px;height:52px}#brand{font-size:13px}#hint{top:84px}}
</style></head><body><div id="hud"><div class="panel"><div id="brand">🌷 Little Things Village</div><div id="where">Village Street · House Cleaner</div></div><div class="panel" id="coins">🪙 0</div></div><div id="hint">Move with the joystick or tap the ground. Walk to a glowing door!</div><div id="toast"></div><div id="controls"><div id="pad"><div id="stick"></div></div><div id="actions"><button id="switch">👥 Characters</button><button id="action">✨ Interact</button></div></div><div id="footer">3D prototype · tap ground to walk · drag to rotate view</div><div id="modal"><div id="sheet"><button id="close">✕</button><h2 id="modalTitle"></h2><p id="modalDesc"></p><div id="choices"></div></div></div><div id="error"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9e3f3');scene.fog=new THREE.Fog('#b9e3f3',32,80);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,130);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'default'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xb6b3a6,2.15));const sun=new THREE.DirectionalLight(0xfff3d8,2.4);sun.position.set(-10,20,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.88});const M={grass:mat('#98bf8c'),road:mat('#a9a2a0'),walk:mat('#e9d4bd'),wood:mat('#c59b79'),wall:mat('#f5e9da'),pink:mat('#dca4b3'),mint:mat('#9fccc1'),blue:mat('#a9c7d9'),cream:mat('#fff0c9'),dark:mat('#514b55'),leaf:mat('#7ba878'),hair:mat('#49382e'),skin:mat('#f0b68d'),gold:mat('#edcb77'),white:mat('#fffdf2'),red:mat('#c98083')};let world=new THREE.Group();scene.add(world);let interactables=[], blockers=[],labels=[];
function box(parent,x,y,z,w,h,d,m,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;parent.add(o);return o}function ball(parent,x,y,z,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}function cylinder(parent,x,y,z,r,h,m){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}function label(parent,text,x,y,z,size=1.8){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#fff9ec';ctx.beginPath();ctx.roundRect(6,5,500,118,28);ctx.fill();ctx.strokeStyle='#ba9a9b';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#594b54';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 48px system-ui';ctx.fillText(text,256,64,490);let tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;let mesh=new THREE.Mesh(new THREE.PlaneGeometry(size,size/4),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));mesh.position.set(x,y,z);parent.add(mesh);labels.push(mesh);return mesh}
function tree(x,z){cylinder(world,x,.65,z,.22,1.3,M.wood);ball(world,x,1.85,z,.85,M.leaf);ball(world,x-.5,1.6,z,.56,M.leaf)}function flower(x,z){cylinder(world,x,.2,z,.035,.4,M.leaf);ball(world,x,.43,z,.12,M.pink)}
const careers=[{id:'clean',name:'House Cleaner',icon:'🧽',color:M.mint},{id:'salon',name:'Hairstylist',icon:'💇‍♀️',color:M.pink},{id:'cafe',name:'Barista',icon:'☕',color:M.blue}];let active=0,place='street',money=0,completed={clean:0,salon:0,cafe:0},taskProgress={clean:0,salon:0,cafe:0};
const tasks={clean:[{name:'Sort the laundry',prompt:'Three piles: whites, darks, and delicates. A red silk blouse should go where?',choices:['Whites','Darks','Delicates'],answer:2,explain:'Silk is delicate. Separate it before washing.'},{name:'Clean the kitchen',prompt:'The countertop has food crumbs and grease. What should you do first?',choices:['Clear crumbs and clutter','Spray perfume','Polish the floor'],answer:0,explain:'Remove debris before treating grease.'},{name:'Finish the living room',prompt:'There is dust on the shelves and dirt on the floor. Which order avoids doing work twice?',choices:['Vacuum, then dust','Dust, then vacuum','Mop the couch'],answer:1,explain:'Work from top to bottom.'}],salon:[{name:'Client consultation',prompt:'Your client has very tangled hair. What should you do before shampooing?',choices:['Rip through with a brush','Gently detangle in sections','Apply permanent color immediately'],answer:1,explain:'Careful sectioning reduces breakage.'},{name:'Wash station',prompt:'Your client has a dry, irritated scalp. Which approach is gentlest?',choices:['Very hot water and vigorous scrubbing','Lukewarm water and gentle massage','Skip rinsing completely'],answer:1,explain:'Gentle cleansing is best.'},{name:'Styling chair',prompt:'Your client wants a smooth blowout. What helps protect the hair?',choices:['Heat protectant and controlled heat','Maximum heat without protection','Leave shampoo in'],answer:0,explain:'Use protection and appropriate heat.'}],cafe:[{name:'Take the order',prompt:'Customer: “Iced vanilla latte, oat milk, no whipped cream.” Which ticket is right?',choices:['Hot latte, dairy milk','Iced vanilla latte, oat milk','Iced mocha, whipped cream'],answer:1,explain:'Correct! Match every customization.'},{name:'Make the drink',prompt:'You need to build an iced latte. What belongs in the cup?',choices:['Espresso, milk, ice','Tea, lemon, hot water','Espresso and soup'],answer:0,explain:'Espresso, milk and ice make the base.'},{name:'Serve the customer',prompt:'Three drinks are ready. Which goes to the customer who ordered the iced vanilla oat latte?',choices:['Hot caramel latte','Iced vanilla oat latte','Strawberry smoothie'],answer:1,explain:'Perfect match!'}]};
let avatar=new THREE.Group();function makeAvatar(){avatar.clear();cylinder(avatar,0,.49,0,.21,.88,careers[active].color);ball(avatar,0,1.23,0,.31,M.skin);ball(avatar,0,1.4,-.06,.31,M.hair);box(avatar,-.14,.16,0,.16,.35,.19,M.dark);box(avatar,.14,.16,0,.16,.35,.19,M.dark);ball(avatar,-.105,1.25,.275,.035,M.dark);ball(avatar,.105,1.25,.275,.035,M.dark);ball(avatar,0,1.14,.3,.04,M.red);box(avatar,-.29,.68,0,.15,.52,.16,M.skin);box(avatar,.29,.68,0,.15,.52,.16,M.skin)}makeAvatar();scene.add(avatar);
function addTarget(x,z,type,title,fn){let o=ball(world,x,.22,z,.24,M.gold);o.userData={type,title,fn};interactables.push(o);return o}function furniture(x,z,w,d,m){box(world,x,.36,z,w,.7,d,m)}
function building(x,z,w,d,color,title,career){box(world,x,1.55,z,w,3.1,d,color);box(world,x,3.3,z,w+.5,.45,d+.5,M.dark);box(world,x,1.1,z+d/2+.045,1.35,2.2,.12,M.wood);box(world,x-1.65,1.8,z+d/2+.08,1.15,1.2,.12,M.blue);label(world,title,x,3.85,z+d/2+.4,3);addTarget(x,z+d/2+1.1,'door',title,()=>enter(career));blockers.push({x,z,w,d})}
function buildStreet(){world.clear();interactables=[];blockers=[];labels=[];box(world,0,-.13,0,52,.2,52,M.grass,false);box(world,0,-.005,2,52,.06,4.4,M.road,false);box(world,0,.015,5.0,52,.07,1.3,M.walk,false);box(world,0,.015,-1,52,.07,1.2,M.walk,false);building(-11,-7,7,6,M.mint,'CLEANING HOUSE','clean');building(0,-7,7,6,M.pink,'HAIR SALON','salon');building(11,-7,7,6,M.blue,'VILLAGE CAFÉ','cafe');for(let i=-23;i<24;i+=4){tree(i,10+Math.sin(i)*1.4);if(i%3===0)flower(i,6)}for(let i=-21;i<=21;i+=6){box(world,i,.028,2,2,.018,.11,M.cream,false)}label(world,'WELCOME TO LITTLE THINGS VILLAGE',0,1.1,12,6);box(world,0,.2,11,7,.4,1.1,M.wood);for(let i=0;i<3;i++)flower(-6+i*1.5,7.2);avatar.position.set(0,0,5.2)}
function roomBase(color,title){world.clear();interactables=[];blockers=[];labels=[];scene.background=new THREE.Color('#f3e4d9');scene.fog=new THREE.Fog('#f3e4d9',28,65);box(world,0,-.12,0,17,.2,15,M.wood,false);box(world,0,1.8,-7.3,17,3.6,.3,color);box(world,-8.4,1.8,0,.3,3.6,15,color);box(world,8.4,1.8,0,.3,3.6,15,color);label(world,title,0,3.05,-7.05,5);box(world,0,.08,7.2,2.4,.12,.3,M.gold);addTarget(0,6.5,'exit','Leave building',()=>enter('street'));avatar.position.set(0,0,4.5)}
function buildClean(){roomBase(M.mint,'THE CLEANING HOUSE');furniture(-4,-3,3,1.6,M.cream);box(world,-4,.86,-3,2.7,.3,1.3,M.white);furniture(4,-3,2.4,2.3,M.blue);for(let i=0;i<7;i++)box(world,-4+i*.4,.76,-1.5,.27,.17,.3,i%2?M.pink:M.dark);for(let i=0;i<4;i++)ball(world,3+i*.55,.75,-3,.28,i%2?M.red:M.cream);furniture(-4,2,2.4,1,M.wood);addTarget(-4,-1,'task','Laundry pile',()=>job('clean',0));addTarget(4,-1,'task','Kitchen mess',()=>job('clean',1));addTarget(-4,3,'task','Dusty shelves',()=>job('clean',2));label(world,'LAUNDRY',-4,1.9,-4.4,2.4);label(world,'KITCHEN',4,1.9,-4.4,2.4)}
function buildSalon(){roomBase(M.pink,'THE HAIR SALON');for(let i=-1;i<=1;i++){let x=i*4.3;furniture(x,-3.4,1.7,1.5,M.cream);box(world,x,1.7,-6.9,1.7,1.7,.13,M.blue);cylinder(world,x,.8,-3.4,.45,.25,M.dark);ball(world,x,1.1,-3.4,.28,M.skin)}furniture(-4,2,2,1.1,M.white);furniture(4,2,2,1.1,M.wood);addTarget(-4,3,'task','Consultation',()=>job('salon',0));addTarget(-4,-1,'task','Wash bowls',()=>job('salon',1));addTarget(4,-1,'task','Styling station',()=>job('salon',2));label(world,'WASH',-4,1.7,-5,2);label(world,'STYLE',4,1.7,-5,2)}
function buildCafe(){roomBase(M.blue,'THE VILLAGE CAFÉ');furniture(0,-3,10,1.5,M.wood);for(let i=-1;i<=1;i++){let x=i*2.3;box(world,x,1,-3,1.3,.8,.7,i===0?M.dark:M.cream);cylinder(world,x,1.45,-2.5,.17,.27,M.white)}for(let i=-1;i<=1;i++){let x=i*4.7;furniture(x,2.4,1.7,1.7,M.cream);cylinder(world,x,.85,2.4,.3,.3,M.white)}addTarget(-4,-1,'task','Order register',()=>job('cafe',0));addTarget(0,-1,'task','Espresso machine',()=>job('cafe',1));addTarget(4,-1,'task','Pickup counter',()=>job('cafe',2));label(world,'ORDER',-4,1.8,-5,2);label(world,'ESPRESSO',0,1.8,-5,2.4);label(world,'PICKUP',4,1.8,-5,2)}
function enter(id){place=id;if(id==='street'){scene.background=new THREE.Color('#b9e3f3');scene.fog=new THREE.Fog('#b9e3f3',32,80);buildStreet()}else if(id==='clean')buildClean();else if(id==='salon')buildSalon();else buildCafe();document.getElementById('where').textContent=(place==='street'?'Village Street':careers.find(c=>c.id===place).name)+' · '+careers[active].name;document.getElementById('hint').textContent=place==='street'?'Walk to a golden door and tap Interact.':'Walk to a golden station and tap Interact. The exit is by the front door.';targetPoint=null;updateNearby()}
let modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),desc=document.getElementById('modalDesc'),choices=document.getElementById('choices');function show(t,d,buttons){title.textContent=t;desc.textContent=d;choices.replaceChildren();for(let b of buttons){let el=document.createElement('button');el.textContent=b.text;el.onclick=b.fn;choices.append(el)}modal.classList.add('show')}function hide(){modal.classList.remove('show')}document.getElementById('close').onclick=hide;function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2300)}
function job(id,step){if(careers[active].id!==id){toast('Switch to the '+careers.find(c=>c.id===id).name+' character to work here.');return}if(taskProgress[id]!==step){toast('Complete station '+(taskProgress[id]+1)+' first!');return}let t=tasks[id][step];show(t.name,t.prompt,t.choices.map((text,i)=>({text,fn:()=>{if(i===t.answer){hide();taskProgress[id]++;money+=15;document.getElementById('coins').textContent='🪙 '+money;toast('✨ '+t.explain+' +15 coins');if(taskProgress[id]===3){completed[id]++;taskProgress[id]=0;setTimeout(()=>show('Amazing work! 🎉','You completed a full '+careers[active].name+' shift! '+completed[id]+' shift(s) finished.',[{text:'Keep exploring',fn:hide}]),450)}}else{toast('Not quite! Try another answer.')}}})))}
document.getElementById('switch').onclick=()=>show('Choose your character 💗','Each career belongs to its own character. Switch anytime. Your work stays saved during this session.',careers.map((c,i)=>({text:c.icon+' '+c.name+(i===active?' ✓':''),fn:()=>{active=i;makeAvatar();hide();document.getElementById('where').textContent=(place==='street'?'Village Street':careers.find(c=>c.id===place).name)+' · '+careers[active].name;toast('Now playing: '+c.name)}})));
let nearby=null;function updateNearby(){let closest=null,dist=1.7;for(let obj of interactables){let d=Math.hypot(obj.position.x-avatar.position.x,obj.position.z-avatar.position.z);if(d<dist){closest=obj;dist=d}}nearby=closest;document.getElementById('action').textContent=nearby?'✨ '+nearby.userData.title:'✨ Interact'}document.getElementById('action').onclick=()=>{if(nearby)nearby.userData.fn();else toast('Walk closer to a glowing station or door!')};
let joy={x:0,y:0},targetPoint=null,dragging=false,start={x:0,y:0},cameraAngle=0;const pad=document.getElementById('pad'),stick=document.getElementById('stick');function movePad(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=r.width*.34;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.left=(r.width/2-stick.offsetWidth/2+dx)+'px';stick.style.top=(r.height/2-stick.offsetHeight/2+dy)+'px'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);movePad(e);targetPoint=null});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))movePad(e)});function resetPad(){joy.x=joy.y=0;stick.style.left=(pad.clientWidth/2-stick.offsetWidth/2)+'px';stick.style.top=(pad.clientHeight/2-stick.offsetHeight/2)+'px'}pad.addEventListener('pointerup',resetPad);pad.addEventListener('pointercancel',resetPad);
let ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;start={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging&&Math.abs(e.clientX-start.x)>20){cameraAngle+=(e.clientX-start.x)*.004;start.x=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-start.x)<14&&Math.abs(e.clientY-start.y)<14){pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);if(ray.ray.intersectPlane(ground,hit))targetPoint=hit.clone()}dragging=false});const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e')document.getElementById('action').click()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function canMove(x,z){if(place==='street'){if(Math.abs(x)>24||Math.abs(z)>23)return false;for(let b of blockers){if(Math.abs(x-b.x)<b.w/2+.38&&Math.abs(z-b.z)<b.d/2+.38)return false}}else if(Math.abs(x)>7.8||Math.abs(z)>6.7)return false;return true}
let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.04);last=now;let dx=joy.x,dy=joy.y;if(keys.arrowleft||keys.a)dx-=1;if(keys.arrowright||keys.d)dx+=1;if(keys.arrowup||keys.w)dy-=1;if(keys.arrowdown||keys.s)dy+=1;let vx=dx*Math.cos(cameraAngle)+dy*Math.sin(cameraAngle),vz=dy*Math.cos(cameraAngle)-dx*Math.sin(cameraAngle);if(Math.hypot(dx,dy)<.1&&targetPoint){vx=targetPoint.x-avatar.position.x;vz=targetPoint.z-avatar.position.z;if(Math.hypot(vx,vz)<.28){targetPoint=null;vx=vz=0}}let len=Math.hypot(vx,vz);if(len>.08){vx/=len;vz/=len;let speed=4.3;if(canMove(avatar.position.x+vx*dt*speed,avatar.position.z))avatar.position.x+=vx*dt*speed;if(canMove(avatar.position.x,avatar.position.z+vz*dt*speed))avatar.position.z+=vz*dt*speed;avatar.rotation.y=Math.atan2(vx,vz)}let off=new THREE.Vector3(Math.sin(cameraAngle)*10,10,Math.cos(cameraAngle)*12);let desired=avatar.position.clone().add(off);camera.position.lerp(desired,.085);camera.lookAt(avatar.position.x,1,avatar.position.z);for(let o of interactables){o.position.y=.2+Math.sin(now*.003+o.position.x)*.08;o.rotation.y+=dt}for(let l of labels)l.quaternion.copy(camera.quaternion);updateNearby();renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});enter('street');requestAnimationFrame(frame);
</script><script>window.addEventListener('error',e=>{let el=document.getElementById('error');el.style.display='block';el.textContent='Game loading error: '+e.message+' — This game requires internet access to load its 3D engine.'})</script></body></html>
