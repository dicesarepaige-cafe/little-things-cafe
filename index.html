<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Little Things Café 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#e8d2c7;color:#62454d}canvas{display:block;touch-action:none}#hud{position:fixed;top:8px;left:8px;right:8px;pointer-events:none;display:flex;justify-content:space-between;gap:8px}#hud>*{background:#fff9f0ed;border-radius:12px;padding:8px 11px;box-shadow:0 2px 10px #70534822}#hud strong{font-family:Georgia;font-size:16px}#hud small{display:block;font-size:11px}#buttons{position:fixed;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}button{border:1px solid #b99499;background:#fff9f0ec;color:#754e61;padding:12px;border-radius:14px;font-weight:bold;font-size:14px;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px}#pad button{height:48px;padding:0}#action{max-width:160px;background:#aa758a;color:white}#notice{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#fffaf2e8;padding:9px 12px;border-radius:12px;text-align:center;font-size:12px;max-width:75%;pointer-events:none}#error{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#fff9f0}</style></head><body><div id="hud"><div><strong>Little Things Café ♡</strong><small>3D walkable prototype</small></div><div><small id="status">Day 1 · $30</small><small id="held">Hands empty</small></div></div><div id="notice">Walk around using the arrows or tap the floor. Approach a station to interact.</div><div id="buttons"><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div style="display:flex;flex-direction:column;gap:8px"><button id="camera">📷 Switch camera</button><button id="action">✋ Int function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}function cyl(x,y,z,r,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),m);o.position.set(x,y,z);scene.add(o);return o}function sphere(x,y,z,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);scene.add(o);return o}
// Real tiled floor, back wall, window framing and door
box(0,-.13,0,11,.22,10,cream);const grout=mat('#d6c1b2');for(let i=-5;i<=5;i++){box(i,-.012,0,.025,.01,10,grout)}for(let j=-5;j<=5;j++){box(0,-.011,j,11,.01,.025,grout)}box(0,1.8,-4.8,11,3.6,.25,mat('#e8cfc9'));box(-5.35,1.8,0,.25,3.6,10,mat('#e8cfc9'));box(5.35,1.8,0,.25,3.6,10,mat('#e8cfc9'));
for(let x of [-3.5,3.5]){box(x,2.35,-4.61,1.7,1.4,.07,white);box(x,2.35,-4.54,1.48,1.19,.08,glass);box(x,2.35,-4.47,.065,1.2,.09,white);box(x,2.35,-4.47,1.5,.065,.09,white)}
box(0,1.5,4.7,1.7,3,.13,mat('#d9b2a4'));box(0,1.5,4.62,1.4,2.6,.07,glass);cyl(.52,1.35,4.51,.055,.2,metal);

// Espresso machine, grinder, cups, milk, ice and syrup bottles as geometry
box(-2.4,1.55,-3.7,1.4,.7,.75,metal);box(-2.4,1.93,-3.7,1.5,.14,.84,mat('#677477'));for(let x of [-2.72,-2.08]){cyl(x,1.23,-3.24,.12,.12,coffee);cyl(x,1.35,-3.24,.1,.16,white)}box(-.9,1.55,-3.72,.6,.75,.62,mat('#758886'));cyl(-.9,2.07,-3.72,.29,.32,glass);sphere(-.9,2.27,-3.72,.18,coffee);
for(let i=0;i<3;i++){let x=.2+i*.4;cyl(x,1.3,-3.6,.16,.24,white);cyl(x,1.45,-3.6,.18,.05,white)}
box(2,1.43,-3.65,1.2,.52,.8,sage);for(let x of [1.65,2.05,2.45]){box(x,1.88,-3.65,.23,.6,.23,mat(['#a46c55','#cf9b69','#805c4b'][Math.round((x-1.65)/.4)]));cyl(x,2.22,-3.65,.08,.1,metal)}
box(3.5,1.48,-3.6,.9,.62,.7,mat('#c4dce3'));box(3.5,1.81,-3.6,.7,.07,.55,white);
// Service counter and register
box(0,.52,-1.25,8.5,1,1.05,wood);box(0,1.08,-1.25,8.7,.14,1.2,white);box(-2.9,1.33,-1.25,.55,.48,.15,mat('#798a86'));box(-2.9,1.14,-.91,.43,.08,.37,metal);
// tables
for(let x of [-3.3,3.3]){cyl(x,.67,2,.77,.1,white);cyl(x,.33,2,.08,.6,wood);for(let z of [1.2,2.8]){box(x,.39,z,.75,.15,.58,sage);box(x,.19,z,.5,.4,.48,wood)}}
const stations=[{name:'Clear iced cups',x:.2,z:-3.1},{name:'Espresso machine',x:-2.4,z:-3.1},{name:'Coffee grinder',x:-.9,z:-3.1},{name:'Milk fridge',x:3.5,z:-3.1},{name:'Syrup pumps',x:2,z:-3.1},{name:'Register',x:-2.9,z:-.35}];
// Rounded full-body character
const avatar=new THREE.Group();scene.add(avatar);function part(mesh){avatar.add(mesh);return mesh}function limb(x,y,z,r,h,m){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);mesh.position.set(x,y,z);return part(mesh)}const skin=mat('#e9b18e'),hair=mat('#6e4b42'),pants=mat('#67758c');let torso=part(new THREE.Mesh(new THREE.CylinderGeometry(.28,.33,.65,16),pink));torso.position.y=.85;let head=part(new THREE.Mesh(new THREE.SphereGeometry(.32,20,16),skin));head.position.y=1.42;let cap=part(new THREE.Mesh(new THREE.SphereGeometry(.33,20,16),hair));cap.position.set(0,1.59,-.065);cap.scale.y=.52;let legs=[limb(-.15,.31,0,.115,.53,pants),limb(.15,.31,0,.115,.53,pants)],arms=[limb(-.39,.84,0,.09,.53,skin),limb(.39,.84,0,.09,.53,skin)];for(let x of [-.11,.11]){let eye=part(new THREE.Mesh(new THREE.SphereGeometry(.026,8,8),hair));eye.position.set(x,1.45,.29)}avatar.position.set(0,0,2.9);
// Customer character near service counter
const guest=new THREE.Group();scene.add(guest);const gbody=new THREE.Mesh(new THREE.CylinderGeometry(.29,.31,.67,16),sage);gbody.position.y=.83;guest.add(gbody);const ghead=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),mat('#cb9274'));ghead.position.y=1.42;guest.add(ghead);for(let x of [-.15,.15]){let l=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.55,12),pants);l.position.set(x,.3,0);guest.add(l)}guest.position.set(1.9,0,.15);
// Floating little printed receipt near register
const receipt=document.createElement('canvas');receipt.width=128;receipt.height=190;const rc=receipt.getContext('2d');rc.fillStyle='#fffaf1';rc.fillRect(0,0,128,190);rc.fillStyle='#40352f';rc.font='bold 14px monospace';rc.fillText('LT CAFE',20,23);rc.font='11px monospace';['------------','#001   MED','ICED LATTE','OAT MILK','VANILLA','------------','TO GO'].forEach((s,i)=>rc.fillText(s,8,47+i*18));const paper=new THREE.Mesh(new THREE.PlaneGeometry(.47,.7),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(receipt),side:THREE.DoubleSide}));paper.position.set(-3.7,1.68,-1.18);scene.add(paper);
let view=0,held='',coins=30,step=0,keys=new Set(),destination=null;const notice=document.getElementById('notice');function say(t){notice.textContent=t}function interact(){let closest=null,dist=Infinity;for(let s of stations){let d=Math.hypot(avatar.position.x-s.x,avatar.position.z-s.z);if(d<dist){dist=d;closest=s}}if(dist>2.15){say('Walk closer to a coffee station first.');return}held=closest.name;document.getElementById('held').textContent='Holding: '+held;if(closest.name==='Clear iced cups'){step=1;say('🥤 You picked up a medium clear cup. Go to the grinder.')}else if(closest.name==='Coffee grinder'&&step>=1){step=2;say('🫘 Beans grind into fresh coffee grounds. Now visit the espresso machine.')}else if(closest.name==='Espresso machine'&&step>=2){step=3;say('☕ Espresso pours into the cup! Next: syrup and milk.')}else if(closest.name==='Syrup pumps'&&step>=3){step=4;say('🍯 Vanilla syrup added. Go to the milk fridge.')}else if(closest.name==='Milk fridge'&&step>=4){step=5;say('🥛 Oat milk poured! Bring the latte to the register.')}else if(closest.name==='Register'&&step>=5){coins+=11;step=0;held='';document.getElementById('status').textContent='Day 1 · $'+coins;document.getElementById('held').textContent='Hands empty';say('🌟 Served! Customer loved it. +$11. Start another drink.')}else say('You tapped the '+closest.name+'. Follow the recipe order to prepare the latte.')}
document.getElementById('action').onclick=interact;document.getElementById('camera').onclick=()=>{view=1-view;say(view?'Behind-character camera':'Angled Animal Crossing-style camera')};for(let b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.dir);b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(b.dataset.dir))}window.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){keys.add(k);e.preventDefault()}if(e.key===' ')interact()});window.addEventListener('keyup',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k)keys.delete(k)});const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),floor=new THREE.Plane(new THREE.Vector3(0,1,0),0);renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();if(ray.ray.intersectPlane(floor,p))destination={x:Math.max(-4.5,Math.min(4.5,p.x)),z:Math.max(-3,Math.min(4,p.z))}});
const clock=new THREE.Clock();function render(){requestAnimationFrame(render);let dt=Math.min(.04,clock.getDelta()),dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dz=(keys.has('down')?1:0)-(keys.has('up')?1:0);if(dx||dz){destination=null;let n=Math.hypot(dx,dz);dx/=n;dz/=n}else if(destination){dx=destination.x-avatar.position.x;dz=destination.z-avatar.position.z;let d=Math.hypot(dx,dz);if(d<.12){destination=null;dx=dz=0}else{dx/=d;dz/=d}}if(dx||dz){avatar.position.x=Math.max(-4.6,Math.min(4.6,avatar.position.x+dx*dt*2.7));avatar.position.z=Math.max(-3.05,Math.min(4.2,avatar.position.z+dz*dt*2.7));avatar.rotation.y=Math.atan2(dx,dz);let swing=Math.sin(performance.now()*.013)*.25;legs[0].rotation.x=swing;legs[1].rotation.x=-swing;arms[0].rotation.x=-swing;arms[1].rotation.x=swing}else{legs.forEach(l=>l.rotation.x=0);arms.forEach(a=>a.rotation.x=0)}let desired=view?new THREE.Vector3(avatar.position.x,3.1,avatar.position.z+5.5):new THREE.Vector3(avatar.position.x+6,7.5,avatar.position.z+9);camera.position.lerp(desired,.07);camera.lookAt(avatar.position.x,.65,avatar.position.z-1.3);renderer.render(scene,camera)}render();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
