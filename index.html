<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Little Things Village — Playable Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f9edf0;color:#513c45;font-family:system-ui,-apple-system,sans-serif}header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#fff6f3}header b{font-size:16px}button,select{border:0;border-radius:12px;padding:10px;background:#fff;color:#513c45;font-weight:700;box-shadow:0 2px 5px #73525a22}select{max-width:155px}#wrap{position:relative;width:100%;max-width:850px;margin:auto}canvas{display:block;width:100%;height:auto;touch-action:none;background:#d5e8ce}#hint{position:absolute;top:9px;left:9px;right:9px;background:#fff9eeec;border-radius:12px;padding:9px 12px;font-size:13px;pointer-events:none}#actions{position:absolute;bottom:12px;right:12px;display:flex;gap:7px;align-items:center}#interact{background:#ffd2a6}#controls{position:absolute;bottom:12px;left:12px;display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px);gap:2px}#controls button{padding:0;background:#fff9e9d9;font-size:21px;touch-action:none}#controls .up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:3}.right{grid-column:3;grid-row:2}#dialog{display:none;position:absolute;left:6%;right:6%;top:17%;background:#fffaf6;border:3px solid #e8b9b8;border-radius:20px;padding:18px;box-shadow:0 15px 40px #3c272b55;max-height:68%;overflow:auto}#dialog h2{margin:0 0 8px;font-size:20px}#dialog p{line-height:1.4;font-size:14px}#dialog button{background:#f8d9d7;margin:5px 5px 0 0}#footer{text-align:center;padding:12px;font-size:12px;color:#78636a}</style></head><body><header><b>🌷 Little Things Village <small>demo 0.1</small></b><select id="career"><option value="clean">🧽 House Cleaner</option><option value="hair">💇 Hairstylist</option><option value="cafe">☕ Barista</option></select></header><div id="wrap"><canvas id="game" width="800" height="530"></canvas><div id="hint">Tap a spot to walk there, or use the arrows. Walk to a door and tap ✨ Interact.</div><div id="controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div><div id="actions"><button id="interact">✨ Interact</button></div><div id="dialog"></div></div><div id="footer">Playable 2D movement prototype • outdoor village + three interiors • saves progress on this device</div><script>
const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),hint=document.querySelector('#hint'),dialog=document.querySelector('#dialog'),career=document.querySelector('#career');let zone='village',p={x:400,y:410},target=null,keys={},money=0,done={clean:0,hair:0,cafe:0},active=null;try{let s=JSON.parse(localStorage.getItem('ltvDemo')||'{}');money=s.money||0;done=s.done||done}catch{};const save=()=>{try{localStorage.setItem('ltvDemo',JSON.stringify({money,done}))}catch{}};const buildings=[{id:'clean',name:'Cleaning House',emoji:'🏠',x:45,y:60,w:205,h:155,color:'#f1c9a9'},{id:'hair',name:'Hair Salon',emoji:'💇',x:295,y:60,w:205,h:155,color:'#e7b9c7'},{id:'cafe',name:'Cozy Café',emoji:'☕',x:550,y:60,w:205,h:155,color:'#f4d6a2'}];function round(x,y,w,h,r=14){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function rect(x,y,w,h,c,r=10){ctx.fillStyle=c;round(x,y,w,h,r);ctx.fill()}function txt(t,x,y,size=18,color='#654e54',align='center'){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y)}function draw(){ctx.clearRect(0,0,800,530);if(zone==='village'){rect(0,0,800,530,'#cce7ca',0);for(let i=0;i<18;i++){let x=(i*131+25)%800,y=(i*83+20)%530;txt('✿',x,y,17,'#f5e5e6')}rect(0,240,800,145,'#c8c2b5',0);rect(0,272,800,78,'#e7d9c4',0);for(let i=0;i<10;i++)rect(i*90+20,309,42,5,'#fff4e5',2);buildings.forEach(b=>{rect(b.x+4,b.y+9,b.w,b.h,'#acaaa344');rect(b.x,b.y,b.w,b.h,b.color);rect(b.x+10,b.y+13,b.w-20,36,'#fff6ec');txt(b.emoji+' '+b.name,b.x+b.w/2,b.y+39,17);rect(b.x+73,b.y+105,58,50,'#9d756a',4);rect(b.x+90,b.y+120,22,34,'#e9d6bd',3);txt('ENTER',b.x+b.w/2,b.y+96,13);rect(b.x+18,b.y+70,40,34,'#d7edf0');rect(b.x+b.w-57,b.y+70,40,34,'#d7edf0')});txt('🌳',35,405,54);txt('🌳',760,410,54);txt('Little Things Lane',400,475,25);txt('🔒 Road to the next neighborhood — coming later',400,507,14)}else{rect(0,0,800,530,'#f5e8d8',0);rect(28,25,744,474,'#e6bda9',20);rect(45,45,710,434,'#fff5e9',15);rect(310,460,180,38,'#c7aa94',6);txt('🚪 EXIT',400,487,17);if(zone==='clean'){txt('🏠 Messy House',400,87,29);rect(75,120,270,130,'#e6cfaa');txt('🛋️  🧸  🧦  🗑️',210,194,35);rect(450,120,250,130,'#f0dbbf');txt('🍽️  🧽  🥤',570,194,35);rect(80,305,250,110,'#d9c6b6');txt('🧺  👕  👖',205,374,33);txt('🧹 Cleaning station',567,348,21)}if(zone==='hair'){txt('💇 The Little Salon',400,87,29);for(let i=0;i<3;i++){rect(95+i*205,140,145,155,'#edc7cf');txt('🪞',168+i*205,201,54);txt('💺',168+i*205,260,44)}txt('🧴  ✂️  🪮  🎨',410,376,38)}if(zone==='cafe'){txt('☕ Cozy Corner Café',400,87,29);rect(90,135,620,115,'#cba080');txt('☕  🥛  🧋  🍰  🥐',400,204,48);for(let i=0;i<3;i++){txt('🪑',170+i*210,342,46);txt('🍽️',170+i*210,301,38)}txt('Order counter',400,118,18)}}txt(career.value==='clean'?'🧑🏽‍🔧':career.value==='hair'?'👩🏻‍🎤':'👩🏾‍🍳',p.x,p.y+11,40);txt('💰 '+money,740,34,17);requestAnimationFrame(draw)}function nearDoor(){if(zone!=='village')return null;return buildings.find(b=>Math.abs(p.x-(b.x+b.w/2))<90&&Math.abs(p.y-(b.y+157))<88)}function openDialog(title,body,buttons){active=true;dialog.style.display='block';dialog.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>'+buttons.map((b,i)=>`<button data-choice="${i}">${b[0]}</button>`).join('');dialog.querySelectorAll('button').forEach(el=>el.onclick=()=>{let b=buttons[+el.dataset.choice];dialog.style.display='none';active=false;b[1]?.()})}function interact(){if(active)return;if(zone==='village'){let b=nearDoor();if(b){zone=b.id;p={x:400,y:430};target=null;hint.textContent='Explore the room. Tap ✨ Interact to begin a job, or walk to EXIT and interact to leave.'}else openDialog('Explore the village','Walk close to the front door of the cleaning house, hair salon, or café. Then press Interact.',[['Got it']])}else if(p.y>425&&Math.abs(p.x-400)<125){zone='village';p={x:400,y:325};target=null;hint.textContent='Welcome outside! Tap a building door or use the arrows to walk.'}else job()};function job(){let j=zone;if(j==='clean')openDialog('🧽 House-cleaning challenge','A client needs the house cleaned. Which task should you tackle FIRST to clear the space safely?', [['Collect trash and clutter',()=>result(j,true,'Yes! Clearing clutter gives you room to clean surfaces.')],['Mop around the clutter',()=>result(j,false,'Not quite! Clear the floor before mopping.')],['Fold laundry first',()=>result(j,false,'Try making the space safe and accessible first.')]]);if(j==='hair')openDialog('💇 Salon challenge','Your client wants a dramatic new hair color, but their hair is tangled. What should you do before applying color?', [['Apply color immediately',()=>result(j,false,'Check and prepare the hair before chemical services.')],['Consult, assess, and detangle',()=>result(j,true,'Perfect! A consultation and hair assessment come first.')],['Start with the blow-dryer',()=>result(j,false,'Start by understanding the hair and the client’s goals.')]]);if(j==='cafe')openDialog('☕ Café challenge','Order: iced vanilla latte with oat milk. What is the correct set of ingredients?', [['Espresso, vanilla, oat milk, ice',()=>result(j,true,'Correct! Order matched and drink served.')],['Hot chocolate, dairy milk, ice',()=>result(j,false,'That would not match the customer’s order.')],['Espresso, caramel, dairy milk',()=>result(j,false,'Check the flavor and milk substitution.')]])}function result(j,correct,msg){if(correct){money+=25;done[j]++;save()}openDialog(correct?'✨ Great job!':'💡 Try again',msg+(correct?' You earned 25 coins! Completed '+done[j]+' '+(done[j]===1?'job':'jobs')+' in this career.':' No penalty—give it another try.'),[['Continue',()=>{}],['Another challenge',()=>job()]])}career.onchange=()=>{hint.textContent='Switched character! Your other characters keep their own careers.'};cv.addEventListener('pointerdown',e=>{if(active)return;let r=cv.getBoundingClientRect();target={x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*530/r.height}});document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;target=null});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>keys[d]=false))});document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key.slice(5).toLowerCase()]=true;target=null}});document.addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))keys[e.key.slice(5).toLowerCase()]=false});document.querySelector('#interact').onclick=interact;let prev=performance.now();function tick(t){let dt=Math.min((t-prev)/16.67,2);prev=t;if(!active){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*3.3*dt;p.y+=dy/l*3.3*dt}else if(target){let vx=target.x-p.x,vy=target.y-p.y,d=Math.hypot(vx,vy);if(d<5)target=null;else{p.x+=vx/d*Math.min(d,3.3*dt);p.y+=vy/d*Math.min(d,3.3*dt)}}p.x=Math.max(24,Math.min(776,p.x));p.y=Math.max(zone==='village'?235:100,Math.min(zone==='village'?500:462,p.y))}requestAnimationFrame(tick)}requestAnimationFrame(tick);draw();</script></body></html>
