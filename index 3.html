function openStation(i){progress=0;selected='';needed=[1,2,2,1,4,1][i];modal.classList.add('show');title.textContent=['Grind the beans','Pull the espresso','Vanilla syrup station','Choose your milk','Build your iced latte','Serve Ava ♡'][i];sub.textContent=['Freshly ground beans make the best espresso.','Pull two rich espresso shots.','Tap the VANILLA pump twice — just like a real café.','Select the oat milk carton from the fridge.','Prepare the cup in the correct order.','Your latte is ready! Hand it to Ava.'][i];sceneEl.innerHTML=renderStage(i);finish.disabled=true;finish.textContent=i===5?'Serve drink ♡':'Next step →';status.textContent='';let buttons='';if(i===0)buttons='<button data-v="grind">Hold to grind ☕</button>';if(i===1)buttons='<button data-v="shot">Pull espresso shot</button>';if(i===2)buttons='<button data-v="vanilla">Vanilla pump</button><button data-v="caramel">Caramel</button><button data-v="hazelnut">Hazelnut</button>';if(i===3)buttons='<button data-v="dairy">Dairy milk</button><button data-v="oat">Oat milk</button><button data-v="almond">Almond milk</button>';if(i===4)buttons='<button data-v="cup">1. Clear cup</button><button data-v="ice">2. Add ice</button><button data-v="pour">3. Pour latte</button><button data-v="lid">4. Add lid</button>';if(i===5)buttons='<button data-v="serve">Hand drink to Ava ♡</button>';controls.innerHTML=`<div class="choices">${buttons}</div><div class="meter"><div id="fill"></div></div>`;controls.querySelectorAll('button').forEach(b=>b.onclick=()=>act(i,b.dataset.v,b))}
function act(i,v,btn){if(i===0&&v==='grind')progress=1;else if(i===1&&v==='shot')progress=Math.min(2,progress+1);else if(i===2){if(v!=='vanilla'){status.textContent='That isn’t vanilla! Check the receipt.';return}progress=Math.min(2,progress+1)}else if(i===3){if(v!=='oat'){status.textContent='Ava ordered oat milk. Try again!';return}progress=1;btn.classList.add('selected')}else if(i===4){let expected=['cup','ice','pour','lid'][progress];if(v!==expected){status.textContent='Not yet! Next: '+['select the clear cup','add ice','pour espresso, syrup & oat milk','put on the lid'][progress];return}progress++;if(progress===4)document.getElementById('drinkCup').classList.add('lidded')}else if(i===5)progress=1;document.getElementById('fill').style.width=(progress/needed*100)+'%';status.textContent=progress>=needed?'Perfect! ✨':i===2?`${progress}/2 vanilla pumps`:i===1?`${progress}/2 espresso shots`:i===4?`${progress}/4 drink steps`:'Nice!';finish.disabled=progress<needed}
finish.onclick=()=>{if(progress<needed)return;done[step]=true;step++;modal.classList.remove('show');update();if(step===6){toast('⭐ 5 stars! +$4.50 +$1.25 tip');document.getElementById('hintText').textContent='Ava says: “This is SO good!” · ⭐⭐⭐⭐⭐ · $1.25 tip'}else toast('Great job! Next: '+stations[step].name)};document.getElementById('close').onclick=()=>modal.classList.remove('show');
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(path.length){let [x,z]=path[0],dx=x-avatar.position.x,dz=z-avatar.position.z,dist=Math.hypot(dx,dz),speed=2.8*dt;if(dist<speed){avatar.position.x=x;avatar.position.z=z;path.shift();if(!path.length&&movingTo!==null)arrived()}else{avatar.position.x+=dx/dist*speed;avatar.position.z+=dz/dist*speed;avatar.rotation.y=Math.atan2(dx,dz)}avatar.position.y=Math.sin(performance.now()/110)*.025}else avatar.position.y=0;let pos=cameraMode?new T.Vector3(avatar.position.x+5,7.5,avatar.position.z+8):new T.Vector3(0,11.5,12.8);camera.position.lerp(pos,.065);camera.lookAt(cameraMode?new T.Vector3(avatar.position.x,1,avatar.position.z-1.5):new T.Vector3(0,.7,-.9));renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
